<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Claude Site Tools</title>
        <link rel="icon" type="image/png" href="../icons/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="../icons/favicon.svg" />
        <link rel="shortcut icon" href="../icons/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png" />
        <link rel="manifest" href="../icons/site.webmanifest" />
        <link rel="stylesheet" href="popup.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1>Claude Site Tools</h1>
        <hr class="divider" />
        <h2 class="settings-label">SETTINGS</h2>
        <h3 class="section-label">Usage Viewer</h3>
        <label for="enable-usage-viewer" class="toggle">
            Enabled:
            <input type="checkbox" id="enable-usage-viewer" checked/>
            <span class="toggle-track"></span>
        </label>
        <script src="popup.js"></script>
    </body>
</html>
